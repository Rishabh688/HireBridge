<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Login | HireBridge</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <style>
    input::placeholder { color: #475569; }
  </style>
</head>

<body>

<div class="page-center">
  <div class="card">

    <h1>Company Login</h1>
    <p>Manage applicants and hiring dashboard</p>

    <form method="POST">

      <input
        type="text"
        name="username"
        placeholder="Company Username"
        required
      >

      <input
        type="password"
        name="password"
        placeholder="Password"
        required
      >

      <button class="btn-primary" type="submit">
        Login
      </button>

    </form>

  </div>
</div>

</body>
</html>
